<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxy Solutions - Control de Inventario</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    .scanner-box {
      position: relative;
      width: 100%;
      max-width: 340px;
      height: 100px;
      border: 3px solid #6366f1;
      border-radius: 1rem;
      overflow: hidden;
      margin: 0 auto;
    }
    .laser-line {
      position: absolute;
      width: 105%;
      height: 1px;
      background: #ef4444;
      box-shadow: 0 0 12px #ef4444;
      animation: scanMove 1.2s infinite alternate ease-in-out;
    }
    @keyframes scanMove {
      from { top: 5%; }
      to { top: 90%; }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 flex flex-col">

  <script>
    // ⚠️ PEGA AQUÍ TU URL COPIADA DE APPS SCRIPT
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyoAqL5zxpiZGWVhin8BSt0_UYGeYiJRMKt-LYatBfbOtovbRqhYjRoKfLC26KXQc8bvg/exec";
  </script>

  <header class="bg-white shadow-sm border-b px-4 py-3 flex items-center justify-between sticky top-0 z-10">
    <button onclick="toggleMenu()" class="p-2 rounded-lg hover:bg-gray-100 text-gray-600 focus:outline-none">
      <i data-lucide="menu" class="w-6 h-6"></i>
    </button>
    <h1 id="tituloSeccion" class="font-bold text-lg text-gray-800">Registrar Movimiento</h1>
    <div class="w-6"></div>
  </header>

  <div id="overlayMenu" onclick="closeMenu()" class="fixed inset-0 bg-black/50 z-20 hidden transition-opacity"></div>
  <aside id="sideMenu" class="fixed top-0 left-0 h-full w-72 bg-white shadow-2xl z-30 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col justify-between">
    <div>
      <div class="p-5 border-b flex flex-col gap-2">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-2xl bg-emerald-700 text-white flex items-center justify-center font-bold text-lg">GS</div>
          <div class="overflow-hidden">
            <h3 class="font-bold text-gray-900 truncate">Galaxy Solutions EIRL</h3>
            <p class="text-xs text-gray-500 truncate">dancx5739@gmail.com</p>
          </div>
        </div>
        <div>
          <span class="inline-block bg-emerald-100 text-emerald-800 text-xs font-semibold px-3 py-1 rounded-full">Plan Pro Activo</span>
        </div>
      </div>

      <nav class="p-3 space-y-1">
        <button onclick="navegarA('venta', 'Registrar Movimiento')" class="w-full flex items-center gap-4 px-4 py-3 text-emerald-700 bg-emerald-50 font-semibold rounded-xl transition">
          <i data-lucide="shopping-bag" class="w-5 h-5 text-emerald-600"></i> Venta / Registro
        </button>
        <button onclick="navegarA('inventario', 'Inventario Actual')" class="w-full flex items-center gap-4 px-4 py-3 text-gray-700 font-medium rounded-xl hover:bg-gray-100 transition">
          <i data-lucide="archive" class="w-5 h-5 text-gray-500"></i> Inventario
        </button>
      </nav>
    </div>
  </aside>

  <main class="flex-1 p-4 max-w-md w-full mx-auto">
    <section id="sec-venta" class="space-y-4">
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
        
        <div id="scanner-container" class="hidden mb-4 p-3 bg-gray-900 rounded-2xl text-center">
          <div class="scanner-box">
            <video id="webcam" class="w-full h-full object-cover" playsinline></video>
            <div class="laser-line"></div>
          </div>
          <canvas id="canvas" class="hidden"></canvas>
          <button onclick="detenerCamara()" class="mt-3 w-full bg-red-600 text-white py-2 rounded-xl font-medium text-sm hover:bg-red-700 transition">
            Cancelar Escaneo
          </button>
        </div>
        
        <button id="btnCamara" onclick="iniciarCamaraRapida()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-medium mb-4 hover:bg-indigo-700 transition flex items-center justify-center gap-2 shadow-sm">
          <i data-lucide="camera" class="w-5 h-5"></i> Escanear Código QR en Vivo
        </button>

        <form id="invForm" onsubmit="guardarInventario(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Tipo de Movimiento</label>
            <div class="grid grid-cols-2 gap-2">
              <label class="flex items-center justify-center p-2.5 border rounded-xl cursor-pointer hover:bg-gray-50">
                <input type="radio" name="tipoMovimiento" value="ENTRADA" checked class="mr-2 text-emerald-600">
                <span class="font-semibold text-emerald-700 text-sm">🟢 Entrada</span>
              </label>
              <label class="flex items-center justify-center p-2.5 border rounded-xl cursor-pointer hover:bg-gray-50">
                <input type="radio" name="tipoMovimiento" value="SALIDA" class="mr-2 text-emerald-600">
                <span class="font-semibold text-red-600 text-sm">🔴 Salida</span>
              </label>
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700">Código QR</label>
            <input type="text" id="qr" required class="w-full mt-1 p-2.5 border rounded-xl bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          
          <div>
            <label class="block text-sm font-medium text-gray-700">Nombre del Producto</label>
            <input type="text" id="nombre" class="w-full mt-1 p-2.5 border rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-sm font-medium text-gray-700">Cantidad</label>
              <input type="number" id="cantidad" min="1" required class="w-full mt-1 p-2.5 border rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700">Stock Mínimo</label>
              <input type="number" id="cantMinima" min="0" class="w-full mt-1 p-2.5 border rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
          </div>
          
          <button type="submit" id="btnGuardar" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-semibold hover:bg-emerald-700 transition">
            Registrar Movimiento
          </button>
        </form>

        <div id="mensaje" class="mt-4 p-3 text-center font-medium text-sm rounded-xl hidden"></div>
      </div>
    </section>

    <section id="sec-inventario" class="space-y-4 hidden">
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
        <div class="flex items-center justify-between mb-3">
          <input type="text" id="busqueda" onkeyup="filtrarTabla()" placeholder="Buscar producto..." class="w-full p-2.5 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <button onclick="cargarInventario()" class="ml-2 p-2.5 bg-gray-100 text-gray-600 rounded-xl hover:bg-gray-200">
            <i data-lucide="refresh-cw" class="w-5 h-5"></i>
          </button>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-gray-50 text-gray-500 text-xs uppercase border-b">
              <tr>
                <th class="p-2">Producto</th>
                <th class="p-2 text-center">Stock</th>
                <th class="p-2 text-center">Mín.</th>
              </tr>
            </thead>
            <tbody id="tablaInventarioBody" class="divide-y"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script>
    lucide.createIcons();
    let videoStream = null;
    let animFrameId = null;

    function iniciarCamaraRapida() {
      const container = document.getElementById('scanner-container');
      const video = document.getElementById('webcam');
      container.classList.remove('hidden');

      navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }
      }).then(stream => {
        videoStream = stream;
        video.srcObject = stream;
        video.setAttribute("playsinline", true);
        video.play();
        animFrameId = requestAnimationFrame(escanearFrame);
      }).catch(err => {
        alert("Error al iniciar cámara: " + err);
        container.classList.add('hidden');
      });
    }

    function escanearFrame() {
      const video = document.getElementById('webcam');
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.height = video.videoHeight;
        canvas.width = video.videoWidth;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: "dontInvert",
        });

        if (code && code.data) {
          document.getElementById('qr').value = code.data;
          if (navigator.vibrate) navigator.vibrate(100);
          detenerCamara();
          return;
        }
      }
      animFrameId = requestAnimationFrame(escanearFrame);
    }

    function detenerCamara() {
      if (animFrameId) cancelAnimationFrame(animFrameId);
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
      }
      document.getElementById('scanner-container').classList.add('hidden');
    }

    // Petición JSONP segura libre de bloqueos de red
    function enviarPeticionJSONP(params, callback) {
      const callbackName = 'jsonp_cb_' + Math.round(100000 * Math.random());
      window[callbackName] = function(data) {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
        callback(data);
      };

      const script = document.createElement('script');
      params.append('callback', callbackName);
      script.src = `${APPS_SCRIPT_URL}?${params.toString()}`;
      script.onerror = function() {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
        callback({ status: 'error', mensaje: 'Error al conectar con la URL de Google Script.' });
      };
      document.body.appendChild(script);
    }

    function guardarInventario(e) {
      e.preventDefault();
      const btn = document.getElementById('btnGuardar');
      const msg = document.getElementById('mensaje');
      
      btn.disabled = true;
      btn.textContent = "Procesando...";
      msg.classList.add('hidden');

      const params = new URLSearchParams({
        action: "registrar",
        tipoMovimiento: document.querySelector('input[name="tipoMovimiento"]:checked').value,
        qr: document.getElementById('qr').value,
        nombre: document.getElementById('nombre').value,
        cantidad: document.getElementById('cantidad').value,
        cantMinima: document.getElementById('cantMinima').value
      });

      enviarPeticionJSONP(params, function(res) {
        btn.disabled = false;
        btn.textContent = "Registrar Movimiento";
        msg.textContent = res.mensaje;
        
        if (res.status === 'success') {
          msg.className = "mt-4 p-3 text-center font-medium text-sm rounded-xl block bg-green-100 text-green-700 border border-green-200";
          document.getElementById('invForm').reset();
        } else {
          msg.className = "mt-4 p-3 text-center font-medium text-sm rounded-xl block bg-red-100 text-red-700 border border-red-200";
        }
      });
    }

    function cargarInventario() {
      const tbody = document.getElementById('tablaInventarioBody');
      tbody.innerHTML = '<tr><td colspan="3" class="text-center py-4 text-gray-400">Cargando...</td></tr>';

      const params = new URLSearchParams({ action: "obtener" });
      enviarPeticionJSONP(params, function(res) {
        if (!res.data || res.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="3" class="text-center py-4 text-gray-400">Sin productos registrados</td></tr>';
          return;
        }
        tbody.innerHTML = res.data.map(p => {
          const esBajo = p.cantMinima > 0 && p.cantidad <= p.cantMinima;
          return `
            <tr class="hover:bg-gray-50">
              <td class="p-2">
                <div class="font-semibold text-gray-800">${p.nombre || 'Sin nombre'}</div>
                <div class="text-xs text-gray-400">QR: ${p.qr}</div>
              </td>
              <td class="p-2 text-center font-bold ${esBajo ? 'text-red-600' : 'text-gray-700'}">
                ${p.cantidad} ${esBajo ? '⚠️' : ''}
              </td>
              <td class="p-2 text-center text-xs text-gray-400">${p.cantMinima}</td>
            </tr>
          `;
        }).join('');
      });
    }

    function toggleMenu() {
      document.getElementById('sideMenu').classList.toggle('-translate-x-full');
      document.getElementById('overlayMenu').classList.toggle('hidden');
    }

    function closeMenu() {
      document.getElementById('sideMenu').classList.add('-translate-x-full');
      document.getElementById('overlayMenu').classList.add('hidden');
    }

    function navegarA(idSeccion, titulo) {
      document.querySelectorAll('main > section').forEach(sec => sec.classList.add('hidden'));
      document.getElementById(`sec-${idSeccion}`).classList.remove('hidden');
      document.getElementById('tituloSeccion').textContent = titulo;
      closeMenu();
      if (idSeccion === 'inventario') cargarInventario();
    }

    function filtrarTabla() {
      const q = document.getElementById('busqueda').value.toLowerCase();
      const filas = document.querySelectorAll('#tablaInventarioBody tr');
      filas.forEach(f => {
        const texto = f.textContent.toLowerCase();
        f.style.display = texto.includes(q) ? '' : 'none';
      });
    }
  </script>
</body>
</html>
  </script>
</body>
</html>
